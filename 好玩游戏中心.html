        // 流星粒子效果
        class Particle {
            constructor(x, y, type = 'flow') {
                this.x = x;
                this.y = y;
                this.type = type; // 'flow' 表示流星下落，'click' 表示流星绽放
                this.size = Math.random() * 4 + 2;
                
                // 流星下落效果
                if (type === 'flow') {
                    // 从屏幕顶部随机位置生成，向下移动
                    this.x = Math.random() * window.innerWidth;
                    this.y = -20;
                    this.speedX = Math.random() * 1.5 - 0.75; // 水平方向轻微偏移
                    this.speedY = Math.random() * 5 + 3; // 减慢下落速度
                    this.life = 1;
                    this.decay = Math.random() * 0.01 + 0.008; // 延长生命周期
                    this.color = this.getMeteorColor();
                    // 拖尾长度
                    this.tailLength = Math.random() * 40 + 20; // 增加拖尾长度
                } 
                // 点击绽放效果
                else {
                    // 从点击位置向外扩散
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 3;
                    this.speedX = Math.cos(angle) * speed;
                    this.speedY = Math.sin(angle) * speed;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                    this.color = this.getBloomColor();
                    // 拖尾长度
                    this.tailLength = Math.random() * 20 + 10;
                }
                
                // 拖尾数组，用于存储粒子轨迹
                this.tail = [];
                this.maxTailLength = Math.floor(this.tailLength / 2);
            }
            
            // 流星颜色
            getMeteorColor() {
                const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dfe6e9', '#fd79a8', '#a29bfe'];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            // 绽放颜色
            getBloomColor() {
                const colors = ['#ff9ff3', '#f368e0', '#ee5a24', '#00d2d3', '#54a0ff', '#5f27cd', '#00d2d3', '#ff9f43'];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                // 更新位置
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                
                // 更新拖尾
                this.tail.push({x: this.x, y: this.y, life: this.life});
                if (this.tail.length > this.maxTailLength) {
                    this.tail.shift();
                }
            }
            
            draw(ctx) {
                ctx.save();
                
                // 绘制拖尾
                for (let i = 0; i < this.tail.length; i++) {
                    const tail = this.tail[i];
                    const tailAlpha = tail.life * (i / this.tail.length);
                    const tailSize = this.size * (i / this.tail.length);
                    
                    ctx.globalAlpha = tailAlpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(tail.x, tail.y, tailSize, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // 绘制粒子主体
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // 粒子管理器
        class ParticleManager {
            constructor() {
                this.particles = [];
                this.canvas = document.createElement('canvas');
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.ctx = this.canvas.getContext('2d');
                document.getElementById('particleContainer').appendChild(this.canvas);
                this.animate();
                
                // 添加持续生成流星粒子的功能
                this.startMeteorParticles();
                
                // 监听窗口大小变化
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                });
            }
            
            // 持续生成流星粒子
            startMeteorParticles() {
                // 初始化生成一批流星粒子
                for (let i = 0; i < 25; i++) {
                    this.particles.push(new Particle(0, 0, 'flow'));
                }
                
                // 定期生成新的流星粒子
                setInterval(() => {
                    this.particles.push(new Particle(0, 0, 'flow'));
                }, 200);
            }
            
            // 点击生成流星绽放效果
            addParticles(x, y, count = 20) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x, y, 'click'));
                }
            }
            
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    this.particles[i].draw(this.ctx);
                    
                    // 移除生命周期结束的粒子或超出屏幕的流星
                    if (this.particles[i].life <= 0 || 
                        (this.particles[i].type === 'flow' && this.particles[i].y > this.canvas.height + 20)) {
                        this.particles.splice(i, 1);
                    }
                }
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // 初始化粒子管理器
        let particleManager;
        
        // 鼠标拖动相关变量
        let isDragging = false;
        let lastDragX = 0;
        let lastDragY = 0;
        
        // 禁止复制内容的完整措施
        function disableCopy() {
            // 禁止右键菜单
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            
            // 禁止复制、剪切、粘贴事件
            document.addEventListener('copy', function(e) {
                e.preventDefault();
            });
            
            document.addEventListener('cut', function(e) {
                e.preventDefault();
            });
            
            document.addEventListener('paste', function(e) {
                e.preventDefault();
            });
            
            // 禁止选择文本
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
            });
            
            // 禁止鼠标拖拽
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
            });
            
            // 禁止键盘快捷键
            document.addEventListener('keydown', function(e) {
                // 禁止Ctrl+C, Ctrl+A, Ctrl+X, Ctrl+V, Ctrl+U, Ctrl+Shift+I
                if ((e.ctrlKey || e.metaKey) && ['c', 'a', 'x', 'v', 'u'].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                }
                
                // 禁止Shift+F10 (右键菜单)
                if (e.shiftKey && e.key === 'F10') {
                    e.preventDefault();
                }
                
                // 禁止F12
                if (e.key === 'F12') {
                    e.preventDefault();
                }
                
                // 禁止Ctrl+Shift+I
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I') {
                    e.preventDefault();
                }
                
                // 禁止Ctrl+Shift+J
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'J') {
                    e.preventDefault();
                }
                
                // 禁止Ctrl+Shift+C
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
                    e.preventDefault();
                }
            });
        }
        
        // 保存登录历史信息到localStorage
        function saveLoginHistory(username, password) {
            // 获取现有的历史记录
            const history = JSON.parse(localStorage.getItem('loginHistory')) || [];
            
            // 创建新的历史记录项
            const newHistoryItem = {
                username: username,
                password: password,
                timestamp: new Date().toLocaleString()
            };
            
            // 检查是否已存在相同的记录，避免重复
            const existingIndex = history.findIndex(item => item.username === username && item.password === password);
            if (existingIndex !== -1) {
                // 如果存在，移除旧记录
                history.splice(existingIndex, 1);
            }
            
            // 将新记录添加到开头
            history.unshift(newHistoryItem);
            
            // 限制历史记录数量，最多保存5条
            if (history.length > 5) {
                history.pop();
            }
            
            // 保存到localStorage
            localStorage.setItem('loginHistory', JSON.stringify(history));
        }
        
        // 加载登录历史信息
        function loadLoginHistory() {
            // 获取历史记录
            const history = JSON.parse(localStorage.getItem('loginHistory')) || [];
            
            // 获取历史记录显示区域（下拉菜单）
            const historyDropdown = document.getElementById('loginHistoryDropdown');
            if (!historyDropdown) return;
            
            // 清空现有内容
            historyDropdown.innerHTML = '';
            
            // 如果没有历史记录，显示提示信息
            if (history.length === 0) {
                historyDropdown.innerHTML = '<div class="history-empty">暂无登录历史记录</div>';
                return;
            }
            
            // 创建历史记录列表
            const historyList = document.createElement('div');
            historyList.className = 'history-list';
            
            // 添加每条历史记录
            history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="history-info">
                        <div class="history-username">${item.username}</div>
                        <div class="history-password">${'*'.repeat(item.password.length)}</div>
                        <div class="history-time">${item.timestamp}</div>
                    </div>
                `;
                // 添加点击事件，自动填充用户名和密码
                historyItem.addEventListener('click', function() {
                    selectHistoryItem(item.username, item.password);
                });
                historyList.appendChild(historyItem);
            });
            
            historyDropdown.appendChild(historyList);
        }
        
        // 显示登录历史下拉菜单
        function showLoginHistoryDropdown() {
            const dropdown = document.getElementById('loginHistoryDropdown');
            if (dropdown) {
                dropdown.classList.add('show');
            }
        }
        
        // 隐藏登录历史下拉菜单
        function hideLoginHistoryDropdown() {
            const dropdown = document.getElementById('loginHistoryDropdown');
            if (dropdown) {
                dropdown.classList.remove('show');
            }
        }
        
        // 切换登录历史下拉菜单显示状态
        function toggleLoginHistoryDropdown() {
            const dropdown = document.getElementById('loginHistoryDropdown');
            if (dropdown) {
                dropdown.classList.toggle('show');
            }
        }
        
        // 选择历史记录项，自动填充用户名和密码
        function selectHistoryItem(username, password) {
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = password;
            // 选择后关闭下拉菜单
            hideLoginHistoryDropdown();
        }
        
        // 切换密码显示/隐藏状态
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('loginPassword');
            const toggleBtn = document.getElementById('togglePassword');
            const icons = toggleBtn.querySelectorAll('.password-icon');
            
            // 切换密码输入框类型
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // 切换图标显示状态
                icons[0].classList.add('hidden');
                icons[1].classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                // 切换图标显示状态
                icons[0].classList.remove('hidden');
                icons[1].classList.add('hidden');
            }
        }
        
        // 页面加载完成后显示登录界面
        window.onload = function() {
            document.getElementById('loginScreen').style.display = 'flex';
            
            // 初始化粒子管理器
            particleManager = new ParticleManager();
            
            // 为登录界面和游戏选择界面添加点击事件
            const loginScreen = document.getElementById('loginScreen');
            const gameSelectScreen = document.getElementById('gameSelectScreen');
            
            // 点击事件处理函数 - 只有点击空白区域才触发粒子效果
            const handleClick = (e) => {
                // 检查点击的元素是否是空白区域（即直接点击在loginScreen或gameSelectScreen上，而不是它们的子元素）
                if (e.target === loginScreen || e.target === gameSelectScreen) {
                    particleManager.addParticles(e.clientX, e.clientY);
                }
            };
            
            // 添加点击事件监听器
            loginScreen.addEventListener('click', handleClick);
            gameSelectScreen.addEventListener('click', handleClick);
            
            // 检查元素是否为卡片内部的内容区域
            const isCardContentElement = (element) => {
                // 检查元素或其父元素是否是卡片内部的内容区域
                let current = element;
                while (current) {
                    // 检查是否是登录卡片或游戏选择卡片的子元素
                    if (current.classList.contains('login-card') || 
                        current.classList.contains('game-select-card') ||
                        current.classList.contains('login-form') ||
                        current.classList.contains('game-options') ||
                        current.classList.contains('game-option-btn') ||
                        current.classList.contains('login-buttons') ||
                        current.classList.contains('qrcode-login') ||
                        current.id === 'loginUsername' ||
                        current.id === 'loginPassword' ||
                        current.id === 'togglePassword' ||
                        current.id === 'qrcodeLoginModal') {
                        return true;
                    }
                    current = current.parentElement;
                }
                return false;
            };
            
            // 检查元素是否为游戏界面元素
            const isGameElement = (element) => {
                // 检查元素或其父元素是否包含游戏界面相关的类或ID
                let current = element;
                while (current) {
                    if (current.classList.contains('game-navbar') ||
                        current.classList.contains('main-game-area') ||
                        current.classList.contains('game-card') ||
                        current.classList.contains('side-card') ||
                        current.classList.contains('canvas-container') ||
                        current.id === 'gameCanvas' ||
                        current.classList.contains('controls') ||
                        current.id === 'settingsModal') {
                        return true;
                    }
                    current = current.parentElement;
                }
                return false;
            };
            
            // 鼠标按下事件处理函数 - 开始拖动
            const handleMouseDown = (e) => {
                // 只有当点击的是登录界面或游戏选择界面的空白背景区域时，才开始拖动
                // 不允许在卡片内部内容区域或游戏界面触发拖拽效果
                if (!isCardContentElement(e.target) && !isGameElement(e.target)) {
                    isDragging = true;
                    lastDragX = e.clientX;
                    lastDragY = e.clientY;
                }
            };
            
            // 鼠标移动事件处理函数 - 拖动时生成粒子
            const handleMouseMove = (e) => {
                // 只有当正在拖动且当前鼠标位置是登录界面或游戏选择界面的空白背景区域时，才生成粒子
                if (isDragging && !isCardContentElement(e.target) && !isGameElement(e.target)) {
                    // 计算鼠标移动距离
                    const deltaX = e.clientX - lastDragX;
                    const deltaY = e.clientY - lastDragY;
                    
                    // 如果移动距离超过阈值，生成粒子
                    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                        particleManager.addParticles(e.clientX, e.clientY, 10);
                        lastDragX = e.clientX;
                        lastDragY = e.clientY;
                    }
                }
            };
            
            // 鼠标释放事件处理函数 - 结束拖动
            const handleMouseUp = () => {
                isDragging = false;
            };
            
            // 鼠标离开页面事件处理函数 - 结束拖动
            const handleMouseLeave = () => {
                isDragging = false;
            };
            
            // 添加鼠标事件监听器
            document.addEventListener('mousedown', handleMouseDown);
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
            document.addEventListener('mouseleave', handleMouseLeave);
            
            // 启用禁止复制措施
            disableCopy();
            
            // 加载登录历史记录
            loadLoginHistory();
            
            // 获取用户名输入框
            const usernameInput = document.getElementById('loginUsername');
            const dropdown = document.getElementById('loginHistoryDropdown');
            
            // 为用户名输入框添加点击事件，显示下拉菜单
            usernameInput.addEventListener('click', function(e) {
                e.stopPropagation(); // 阻止事件冒泡
                loadLoginHistory(); // 重新加载历史记录
                showLoginHistoryDropdown();
            });
            
            // 为密码输入框添加点击事件，阻止事件冒泡
            const passwordInput = document.getElementById('loginPassword');
            passwordInput.addEventListener('click', function(e) {
                e.stopPropagation();
            });
            
            // 为登录按钮添加点击事件，阻止事件冒泡
            const loginButtons = document.querySelectorAll('.login-buttons button');
            loginButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            });
            
            // 为二维码登录按钮添加点击事件，阻止事件冒泡
            const qrcodeLoginButton = document.querySelector('.qrcode-login button');
            if (qrcodeLoginButton) {
                qrcodeLoginButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }
            
            // 点击页面其他区域，关闭下拉菜单
            document.addEventListener('click', function(e) {
                // 检查点击的元素是否不是用户名输入框或下拉菜单
                if (e.target !== usernameInput && !dropdown.contains(e.target)) {
                    hideLoginHistoryDropdown();
                }
            });
        };
    </script>
